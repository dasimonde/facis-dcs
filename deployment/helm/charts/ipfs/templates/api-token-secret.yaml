{{- if .Values.api.auth.enabled }}
{{- $name := printf "%s-ipfs-api" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := (get ($existing.data | default dict) "token") | b64dec | default (randAlphaNum 48) }}
# Bearer token of the Kubo RPC API (API.Authorizations): random on install,
# kept from this Secret on upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
