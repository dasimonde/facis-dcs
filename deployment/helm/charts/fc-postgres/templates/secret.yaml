apiVersion: v1
kind: Secret
metadata:
  name: fc-postgres
  labels:
    app.kubernetes.io/name: fc-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  database: {{ .Values.auth.database | quote }}
