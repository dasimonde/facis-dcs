apiVersion: apps/v1
kind: Deployment
metadata:
  name: fc-postgres
  labels:
    app.kubernetes.io/name: fc-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # A single-writer Postgres backing both fc-service and its Keycloak; a
  # rolling second pod would race the shared PVC. Matches the sibling
  # ../postgresql chart's own Recreate strategy for the same reason.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fc-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fc-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fc-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fc-postgres
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fc-postgres
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.additionalDatabases }}
            - name: initdb-scripts
              mountPath: /docker-entrypoint-initdb.d
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: fc-postgres
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.additionalDatabases }}
        - name: initdb-scripts
          configMap:
            name: fc-postgres-initdb
            defaultMode: 0755
        {{- end }}
