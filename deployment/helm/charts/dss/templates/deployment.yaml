{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
{{- $tomcat := "/dss/apache-tomcat-11.0.4" }}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- with .Values.image.digest }}{{ $image = printf "%s@%s" $image . }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dss
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dss
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dss
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Tomcat expands the WAR next to itself, so webapps must be writable.
        - name: webapps
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["cp", "{{ $tomcat }}/webapps/ROOT.war", "/webapps/"]
          volumeMounts:
            - name: webapps
              mountPath: /webapps
      containers:
        - name: dss
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The image's entrypoint starts Tomcat in the background then exec's a
          # shell that exits in a detached container, stopping it. Run Tomcat in
          # the foreground so the pod stays up.
          command: ["{{ $tomcat }}/bin/catalina.sh"]
          args: ["run"]
          env:
            # Bound the JVM heap so the demo container has a predictable
            # footprint and is not OOM-killed under the two-instance kind node's
            # memory pressure (its default heap scales to a share of node RAM).
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx1024m"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            # Tomcat serving the DSS landing page can take several seconds under
            # load; the 1s probe default times out ("context deadline exceeded")
            # and flaps the pod NotReady mid-signing.
            timeoutSeconds: 5
            failureThreshold: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dss-custom-properties
              mountPath: {{ $tomcat }}/lib/dss-custom.properties
              subPath: dss-custom.properties
              readOnly: true
            {{- range list "webapps" "logs" "temp" "work" }}
            - name: {{ . }}
              mountPath: {{ printf "%s/%s" $tomcat . }}
            {{- end }}
            - name: catalina-conf
              mountPath: {{ $tomcat }}/conf/Catalina
            - name: tmp
              mountPath: /tmp
        {{- if $tls }}
        {{- include "digital-contracting-service.internalTLSProxy" (dict "root" . "upstreamPort" 8080) | nindent 8 }}
        {{- end }}
      volumes:
        {{- if $tls }}
        {{- include "digital-contracting-service.internalTLSVolume" . | nindent 8 }}
        {{- end }}
        - name: dss-custom-properties
          configMap:
            name: {{ .Release.Name }}-dss-custom-properties
        {{- range list "webapps" "logs" "temp" "work" "catalina-conf" "tmp" }}
        - name: {{ . }}
          emptyDir: {}
        {{- end }}
