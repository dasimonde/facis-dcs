{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dss
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if $tls }}
    {{- include "digital-contracting-service.internalTLSServicePort" . | nindent 4 }}
    {{- end }}
  selector:
    app.kubernetes.io/name: dss
    app.kubernetes.io/instance: {{ .Release.Name }}
