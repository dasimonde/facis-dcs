{{- if and .Values.flowImport.enabled (not .Values.flowsFile.enabled) (.Files.Glob "flows/*.json") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-orce-flow-import
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    # "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        # A pod of this release: the ORCE NetworkPolicy admits it
        # (networkPolicy.ingressFrom).
        app.kubernetes.io/name: orce-flow-import
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # The ORCE image carries curl and jq: nothing is installed at run time.
        - name: flow-importer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ with .Values.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (.Values.jobResources | default .Values.resources) }}
          # Its own pod, so this block does not overlap the server's. Without one
          # a LimitRange default applies and the hook is refused on a namespace
          # whose limits.cpu quota the release already consumes.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AUTH_USERNAME
              value: {{ .Values.flowImport.auth.username | quote }}
            - name: AUTH_PASSWORD
              value: {{ .Values.flowImport.auth.password | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -ex

              BASE_URL="http://{{ .Release.Name }}-orce:{{ .Values.service.port | default 1880 }}"

              # Wait until ORCE is ready
              echo "Waiting for ORCE..."
              TIMEOUT=120
              ELAPSED=0
              until curl -sf "$BASE_URL/" > /dev/null; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout: ORCE not reachable"
                  exit 1
                fi
                sleep 3
                ELAPSED=$((ELAPSED + 3))
              done
              echo "ORCE is ready."

              # Get a bearer token
              echo "Getting an auth token..."
              # TOKEN_RESPONSE=$(curl -sf -X POST "$BASE_URL/auth/token" \
              #   -H "Content-Type: application/x-www-form-urlencoded" \
              #   -d "client_id=node-red-admin&grant_type=password&username=$AUTH_USERNAME&password=$AUTH_PASSWORD")
              
              TOKEN_RESPONSE=$(curl -sf -X POST "$BASE_URL/auth/token" -H "content-type: application/x-www-form-urlencoded; charset=UTF-8" -H "node-red-api-version: v2" --data-raw "client_id=node-red-admin&grant_type=password&scope=&username=$AUTH_USERNAME&password=$AUTH_PASSWORD")

              echo "Logging in as $AUTH_USERNAME"
              TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

              if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
                echo "Error: no token received."
                exit 1
              fi
              echo "Token received."

              # Merge all flow JSON files into one array
              echo "Merge Flows..."
              MERGED=$(cat /flows/*.json | jq -s 'add')

              FLOW_COUNT=$(echo "$MERGED" | jq 'length')
              echo "$FLOW_COUNT nodes/tabs found."

              # Deploy and verify, with retries: on a Helm upgrade this hook can
              # overtake the ORCE rollout and post the flows to the terminating
              # pod (without persistence the new pod then starts without flows
              # and every HTTP-in route answers 404). So: post, read back
              # through the Service and check that the tabs are there; else
              # authenticate again (the token store is in memory, a new pod
              # does not know old tokens) and post again.
              EXPECTED_TAB=$(echo "$MERGED" | jq -r '[.[] | select(.type == "tab")][0].id')
              echo "Deploying flows (verifying tab: $EXPECTED_TAB)..."
              ATTEMPT=0
              MAX_ATTEMPTS=30
              while true; do
                ATTEMPT=$((ATTEMPT + 1))
                HTTP_CODE=$(curl -s -o /tmp/deploy-resp.txt -w "%{http_code}" --max-time 60 -X POST "$BASE_URL/flows" \
                  -H "Content-Type: application/json" \
                  -H "Node-RED-Deployment-Type: full" \
                  -H "Authorization: Bearer $TOKEN" \
                  -d "$MERGED" || echo 000)
                echo "POST /flows -> HTTP $HTTP_CODE (attempt $ATTEMPT)"
                if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
                  cat /tmp/deploy-resp.txt || true
                fi
                sleep 3
                DEPLOYED=$(curl -s --max-time 30 "$BASE_URL/flows" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Node-RED-API-Version: v2" | jq -r --arg t "$EXPECTED_TAB" '[.flows[]? | select(.id == $t)] | length' 2>/dev/null || echo 0)
                if [ "$DEPLOYED" = "1" ]; then
                  echo "All flows imported and verified."
                  break
                fi
                if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
                  echo "Error: flows not verified after $MAX_ATTEMPTS attempts."
                  exit 1
                fi
                echo "Flows not visible yet (pod rollout?): getting a new token and retrying..."
                sleep 3
                TOKEN_RESPONSE=$(curl -sf -X POST "$BASE_URL/auth/token" -H "content-type: application/x-www-form-urlencoded; charset=UTF-8" -H "node-red-api-version: v2" --data-raw "client_id=node-red-admin&grant_type=password&scope=&username=$AUTH_USERNAME&password=$AUTH_PASSWORD" || true)
                NEW_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
                if [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ]; then
                  TOKEN="$NEW_TOKEN"
                fi
              done
              
          volumeMounts:
            - name: flows
              mountPath: /flows
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flows
          configMap:
            name: {{ .Release.Name }}-orce-flows
        - name: tmp
          emptyDir: {}
{{- end }}