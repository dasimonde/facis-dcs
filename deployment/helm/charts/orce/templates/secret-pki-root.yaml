{{- if .Values.pkiRootCA.devFixture }}
{{- if ne .Values.flowsDir "flows-issuer" }}
{{- fail "orce.pkiRootCA.devFixture applies to the issuer flow set only; set orce.flowsDir=flows-issuer or drop it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-orce-pki-root
type: Opaque
stringData:
  root-ca.crt: |
{{ .Files.Get "pki-dev/root-ca.crt" | indent 4 }}
  root-ca.key: |
{{ .Files.Get "pki-dev/root-ca.key" | indent 4 }}
{{- end }}
