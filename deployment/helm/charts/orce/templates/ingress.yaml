{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-orce
  {{- if or .Values.ingress.stripPrefix .Values.ingress.annotations }}
  annotations:
    {{- if .Values.ingress.stripPrefix }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-orce-strip-prefix@kubernetescrd" .Release.Namespace .Release.Name | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .path | default "/" }}
            pathType: {{ $.Values.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Release.Name }}-orce
                port:
                  name: http
    {{- end }}
{{- end }}
