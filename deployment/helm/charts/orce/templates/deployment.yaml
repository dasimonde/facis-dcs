{{- $tls := dig "internalTLS" "enabled" false (.Values.global | default dict) }}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- with .Values.image.digest }}{{ $image = printf "%s@%s" $image . }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-orce
{{- if .Values.checkpointSink.enabled }}
{{- if not (hasPrefix "https://" (trim .Values.checkpointSink.url)) }}
{{- fail "orce.checkpointSink.url must be a non-empty HTTPS URL when checkpointSink.enabled=true" }}
{{- end }}
{{- if le (int .Values.checkpointSink.internalTimeoutSeconds) 0 }}
{{- fail "orce.checkpointSink.internalTimeoutSeconds must be a positive integer when checkpointSink.enabled=true" }}
{{- end }}
{{- if and (not (trim .Values.checkpointSink.bearerToken)) (not (trim .Values.checkpointSink.bearerTokenSecretRef.name)) }}
{{- fail "orce.checkpointSink requires bearerToken or bearerTokenSecretRef.name when enabled" }}
{{- end }}
{{- if and .Values.checkpointSink.bearerTokenSecretRef.name (not (trim .Values.checkpointSink.bearerTokenSecretRef.key)) }}
{{- fail "orce.checkpointSink.bearerTokenSecretRef.key must be non-empty when a Secret is configured" }}
{{- end }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orce
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        # The flows are mounted as a subPath, which Kubernetes never refreshes
        # in a running pod, so an upgrade that only changes a flow left the pod
        # serving the previous one and the change looked like it had no effect.
        checksum/flows: {{ include (print $.Template.BasePath "/configmap-flows.yaml") . | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: orce
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- if .Values.flowsFile.enabled }}
      annotations:
        checksum/flows: {{ include (print $.Template.BasePath "/configmap-flows.yaml") . | sha256sum }}
        checksum/settings: {{ include (print $.Template.BasePath "/configmap-settings.yaml") . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.volumePermissions.enabled }}
        - name: volume-permissions
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["chown", "-R", "{{ .Values.podSecurityContext.runAsUser }}:{{ .Values.podSecurityContext.runAsGroup }}", "/data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: orce-data
              mountPath: /data
        {{- end }}
        # The volume mounted at /data shadows the image's baked-in Node-RED
        # runtime files (settings.js, ...); seed them once. cp -R, not -a: a
        # non-root user cannot keep the root owner of the image files.
        - name: seed-data
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c", "[ -f /seed/settings.js ] || cp -R /data/. /seed/"]
          {{- with .Values.resources }}
          # A pod's effective limit is max(sum of containers, max of init
          # containers), so mirroring the main block here costs nothing while an
          # unset one lets a LimitRange default size the whole pod.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: orce-data
              mountPath: /seed
        {{- if .Values.localTSA.enabled }}
        # openssl ts -reply needs a writable, pre-existing serial file.
        - name: seed-tsa-serial
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c", "[ -f /data/tsa-state/serial ] || echo 01 > /data/tsa-state/serial"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tsa-state
              mountPath: /data/tsa-state
        {{- end }}
      containers:
        - name: orce
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 1880
              protocol: TCP
          {{- if or .Values.global.archiveAuditTokenSecretRef.name .Values.global.archiveAuditToken .Values.global.auditExecutorTokenSecretRef.name .Values.global.auditExecutorToken .Values.global.workflowGateTokenSecretRef.name .Values.global.workflowGateToken .Values.checkpointSink.url .Values.extraEnv $tls }}
          env:
            {{- if $tls }}
            # Node.js trusts the internal CA for HTTPS calls to the DCS backend
            # and Hydra (DCS-NFR-SEC-14).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/dcs-internal-tls/ca.crt
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if or .Values.global.workflowGateTokenSecretRef.name .Values.global.workflowGateToken }}
            - name: ORCE_WORKFLOW_GATE_BEARER_TOKEN
              {{- if .Values.global.workflowGateTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.workflowGateTokenSecretRef.name | quote }}
                  key: {{ .Values.global.workflowGateTokenSecretRef.key | quote }}
              {{- else }}
              value: {{ .Values.global.workflowGateToken | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.checkpointSink.enabled }}
            - name: CHECKPOINT_SINK_ENABLED
              value: "true"
            - name: CHECKPOINT_SINK_URL
              value: {{ .Values.checkpointSink.url | quote }}
            - name: CHECKPOINT_SINK_TIMEOUT_SECONDS
              value: {{ .Values.checkpointSink.timeoutSeconds | quote }}
            - name: CHECKPOINT_INTERNAL_TIMEOUT_SECONDS
              value: {{ .Values.checkpointSink.internalTimeoutSeconds | quote }}
            - name: CHECKPOINT_SINK_ALLOW_INSECURE_TLS
              value: {{ .Values.checkpointSink.allowInsecureTLS | quote }}
            {{- if or .Values.checkpointSink.bearerTokenSecretRef.name .Values.checkpointSink.bearerToken }}
            - name: CHECKPOINT_SINK_BEARER_TOKEN
              {{- if .Values.checkpointSink.bearerTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.checkpointSink.bearerTokenSecretRef.name | quote }}
                  key: {{ .Values.checkpointSink.bearerTokenSecretRef.key | quote }}
              {{- else }}
              value: {{ .Values.checkpointSink.bearerToken | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if or .Values.global.auditExecutorTokenSecretRef.name .Values.global.auditExecutorToken }}
            - name: ORCE_AUDIT_EXECUTOR_BEARER_TOKEN
              {{- if .Values.global.auditExecutorTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.auditExecutorTokenSecretRef.name | quote }}
                  key: {{ .Values.global.auditExecutorTokenSecretRef.key | quote }}
              {{- else }}
              value: {{ .Values.global.auditExecutorToken | quote }}
              {{- end }}
            {{- end }}
            {{- if or .Values.global.archiveAuditTokenSecretRef.name .Values.global.archiveAuditToken }}
            - name: ORCE_ARCHIVE_AUDIT_LOG_BEARER_TOKEN
              {{- if .Values.global.archiveAuditTokenSecretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.archiveAuditTokenSecretRef.name | quote }}
                  key: {{ .Values.global.archiveAuditTokenSecretRef.key | quote }}
              {{- else }}
              value: {{ .Values.global.archiveAuditToken | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: orce-data
              mountPath: /data
            # The local TSA flow writes its query and reply files here.
            - name: tmp
              mountPath: /tmp
            # Also over a persistent volume, so a volume seeded with an older
            # settings.js still runs this one.
            - name: settings
              mountPath: /data/settings.js
              subPath: settings.js
              readOnly: true
            {{- if .Values.pkiRootCA.devFixture }}
            - name: pki-root
              mountPath: /etc/orce/pki-root
              readOnly: true
            {{- end }}
            {{- if $tls }}
            {{- include "digital-contracting-service.internalCAVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- if .Values.flowsFile.enabled }}
            - name: flows-merged
              mountPath: /data/flows.json
              subPath: flows.json
              readOnly: true
            {{- end }}
            {{- if .Values.localTSA.enabled }}
            - name: tsa-config
              mountPath: /data/tsa
              readOnly: true
            - name: tsa-certs
              mountPath: /data/tsa-certs
              readOnly: true
            - name: tsa-state
              mountPath: /data/tsa-state
            {{- end }}
          # TCP, not HTTP: "/" is the editor, which is off without an admin
          # password hash. Node-RED opens the port after it has started the flows.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
        {{- if $tls }}
        {{- include "digital-contracting-service.internalTLSProxy" (dict "root" . "upstreamPort" 1880) | nindent 8 }}
        {{- end }}
      volumes:
        {{- if $tls }}
        {{- include "digital-contracting-service.internalTLSVolume" . | nindent 8 }}
        {{- include "digital-contracting-service.internalCAVolume" . | nindent 8 }}
        {{- end }}
        - name: settings
          configMap:
            name: {{ .Release.Name }}-orce-settings
        - name: orce-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-orce
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.pkiRootCA.devFixture }}
        - name: pki-root
          secret:
            secretName: {{ .Release.Name }}-orce-pki-root
        {{- end }}
        {{- if .Values.flowsFile.enabled }}
        - name: flows-merged
          configMap:
            name: {{ .Release.Name }}-orce-flows-merged
        {{- end }}
        {{- if .Values.localTSA.enabled }}
        - name: tsa-config
          configMap:
            name: {{ .Release.Name }}-orce-tsa
        - name: tsa-certs
          secret:
            secretName: {{ .Release.Name }}-orce-tsa-material
        - name: tsa-state
          emptyDir: {}
        {{- end }}
