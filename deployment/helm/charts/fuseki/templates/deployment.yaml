apiVersion: apps/v1
kind: Deployment
metadata:
  name: fc-fuseki
  labels:
    app.kubernetes.io/name: fc-fuseki
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fc-fuseki
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fc-fuseki
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-tdb-dir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c", "mkdir -p /fuseki/databases/{{ .Values.dataset }}"]
          {{- with .Values.resources }}
          # A pod's effective limit is max(sum of containers, max of init
          # containers), so mirroring the main block here costs nothing while an
          # unset one lets a LimitRange default size the whole pod.
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: fuseki-data
              mountPath: /fuseki/databases
      containers:
        - name: fuseki
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3030
          env:
            - name: JAVA_OPTIONS
              value: {{ .Values.javaOptions | quote }}
          args:
            - "--tdb2"
            - "--loc=/fuseki/databases/{{ .Values.dataset }}"
            - "--update"
            - "/{{ .Values.dataset }}"
          volumeMounts:
            - name: fuseki-data
              mountPath: /fuseki/databases
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: fuseki-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: fc-fuseki
          {{- else }}
          emptyDir: {}
          {{- end }}
