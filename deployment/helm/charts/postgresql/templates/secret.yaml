{{- $name := printf "%s-postgresql" .Release.Name }}
{{- $password := .Values.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password = (get ($existing.data | default dict) "postgres-password") | b64dec | default (randAlphaNum 32) }}
{{- end }}
# With auth.password empty, the password is random on install and kept from
# this Secret on upgrade (DCS-NFR-SEC-12).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  postgres-user: {{ .Values.auth.username | quote }}
  postgres-password: {{ $password | quote }}
  postgres-database: {{ .Values.auth.database | quote }}
