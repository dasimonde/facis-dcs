apiVersion: v1
kind: Service
metadata:
  name: fc-service
  labels:
    app.kubernetes.io/name: federated-catalogue
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if dig "internalTLS" "enabled" false (.Values.global | default dict) }}
  {{- with include "digital-contracting-service.traefikServersTransportAnnotation" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 8081 }}
      targetPort: http
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if dig "internalTLS" "enabled" false (.Values.global | default dict) }}
    {{- include "digital-contracting-service.internalTLSServicePort" . | nindent 4 }}
    {{- end }}
  selector:
    app.kubernetes.io/name: federated-catalogue
    app.kubernetes.io/instance: {{ .Release.Name }}
