{{- $inline := dict }}
{{- range .Values.clients }}
{{- if and .client_secret (not (.client_secretSecretRef | default dict).name) }}
{{- $_ := set $inline .client_id .client_secret }}
{{- end }}
{{- end }}
{{- if $inline }}
# Inline client secrets of hydra.clients. The backend and the client
# registration read them through secretKeyRef, so no pod spec holds them
# (DCS-NFR-SEC-12).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hydra-clients
type: Opaque
stringData:
  {{- range $id, $secret := $inline }}
  {{ $id }}: {{ $secret | quote }}
  {{- end }}
{{- end }}
