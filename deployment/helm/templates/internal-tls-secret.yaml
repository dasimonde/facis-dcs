{{- if .Values.global.internalTLS.enabled }}
{{- $ca := include "digital-contracting-service.internalCA" . | fromJson }}
{{- $issuer := buildCustomCert (b64enc $ca.Cert) (b64enc $ca.Key) }}
{{- $hosts := list }}
{{- $names := list }}
{{- range list "postgresql" "nats" "ipfs" "dss" "orce" "loki" "hydra" }}{{ $names = append $names (printf "%s-%s" $.Release.Name .) }}{{ end }}
{{- $names = append $names (printf "%s-pdf-core" (include "digital-contracting-service.fullname" .)) }}
{{- $names = append $names (include "digital-contracting-service.fullname" .) }}
{{- $names = append $names "fc-service" }}
{{- range $names }}
{{- $hosts = concat $hosts (list . (printf "%s.%s" . $.Release.Namespace) (printf "%s.%s.svc" . $.Release.Namespace) (printf "%s.%s.svc.cluster.local" . $.Release.Namespace)) }}
{{- end }}
{{- /* The leaf is issued again on each render, so a component enabled later is in its names. The CA stays. */}}
{{- $leaf := genSignedCertWithKey (printf "%s-internal" .Release.Name) nil $hosts 3650 $issuer (genPrivateKey "ecdsa") }}
# CA of the in-cluster TLS (DCS-NFR-SEC-14, DCS-NFR-SEC-01). Generated on
# install and kept on upgrade. No pod mounts this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-internal-ca" .Release.Name }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
---
# Server certificate of PostgreSQL, NATS, Loki and the TLS proxies in front of
# IPFS, pdf-core, DSS, ORCE, the backend, the Hydra admin and public APIs and
# the Federated Catalogue, with the CA that clients verify it against.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "digital-contracting-service.internalTLSSecretName" . }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $leaf.Cert | b64enc }}
  tls.key: {{ $leaf.Key | b64enc }}
{{- end }}
