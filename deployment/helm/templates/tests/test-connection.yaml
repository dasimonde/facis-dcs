apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "digital-contracting-service.fullname" . }}-test-connection"
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ['wget']
      args: ['{{ include "digital-contracting-service.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
