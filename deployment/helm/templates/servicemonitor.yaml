{{- /* The alert rules evaluate the series of this scrape, so the ServiceMonitor
     renders wherever they do (DCS-NFR-SEC-11). */}}
{{- if or .Values.serviceMonitor.enabled (and .Values.alerts.enabled (include "digital-contracting-service.prometheusOperator" .)) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "digital-contracting-service.monitoringLabels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "digital-contracting-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- end }}
