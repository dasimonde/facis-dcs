{{- if .Values.fcservice.enabled }}
# fc-service (charts/federated-catalogue) and fc-demo-portal both fall back
# to this Secret's keycloak_client_secret key (KEYCLOAK_CREDENTIALS_SECRET /
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FC_CLIENT_OIDC_CLIENT_SECRET env)
# whenever fcservice.keycloak.clientSecret is left empty. The value is the
# literal placeholder ("**********") committed in the federated-catalogue-
# realm's own `federated-catalogue` client representation (chart content,
# not server-generated, see charts/keycloak/files/fc-realm.json) — confirmed
# live against the real (unmasked) Admin API /client-secret response that
# Keycloak's import takes it at face value, not a real secret to generate or
# rotate.
apiVersion: v1
kind: Secret
metadata:
  name: fc-keycloak-client-secret
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak_client_secret: {{ .Values.fcservice.realmProvision.clientSecret | quote }}
{{- end }}
