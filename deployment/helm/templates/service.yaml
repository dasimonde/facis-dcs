apiVersion: v1
kind: Service
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
  {{- with include "digital-contracting-service.traefikServersTransportAnnotation" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.global.internalTLS.enabled }}
    {{- include "digital-contracting-service.internalTLSServicePort" . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "digital-contracting-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
