{{- if .Values.ingress.enabled -}}
{{- if eq (len .Values.ingress.hosts) 0 -}}
{{- fail "ingress.enabled=true requires at least one entry in ingress.hosts" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.tlsOptions.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.tlsOptions.enabled }}
    {{/*
    Die TLSOption gilt erst, wenn der Router sie nennt. Ohne diese Annotation
    liegt die Ressource im Cluster und Traefik handelt trotzdem TLS 1.2 aus —
    deshalb wird sie hier gesetzt und nicht dem Betreiber ueberlassen.
    */}}
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s-%s-tls13@kubernetescrd" .Release.Namespace (include "digital-contracting-service.fullname" .) | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- if .paths }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default $.Values.ingress.pathType .pathType }}
            backend:
              service:
                name: {{ include "digital-contracting-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port | int }}
          {{- end }}
          {{- else }}
          - path: {{ include "digital-contracting-service.baseRoutePath" $ }}
            pathType: {{ default "Prefix" $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "digital-contracting-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port | int }}
          {{- end }}
          {{- /* Vendored fc-service route on same host when enabled with route.path —
               lets another DCS instance's backend reach this one's FC across clusters.
               Service name/port are fc-service's own fixed defaults (kept verbatim,
               not release-prefixed — see Chart.yaml's fc-service dependency). */}}
          {{- if and $.Values.fcservice.enabled $.Values.fcservice.route.path }}
          - path: {{ include "digital-contracting-service.fcserviceRoutePath" $ }}
            pathType: {{ default "Prefix" $.Values.ingress.pathType }}
            backend:
              service:
                name: fc-service
                port:
                  number: 8081
          {{- end }}
          {{- /* This instance's own /.well-known documents, routed to the backend BEFORE
               Hydra's blanket /.well-known prefix below. A peer resolves this instance's
               did:web against the host root (identity.FetchDIDDocumentFromHostname builds
               https://<host>/.well-known/did.json), and the agreement credential + federation
               rules are fetched the same way by the trust gate. Hydra owning all of
               /.well-known shadows them, so did:web resolution 404s and federation cannot
               start. These are exact paths so ingress-nginx prefers them over that prefix;
               the backend serves each of them (see backend/design/did.go). */}}
          {{- range include "digital-contracting-service.wellKnownPaths" $ | fromYamlArray }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "digital-contracting-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port | int }}
          {{- end }}
          {{- /* The status list this instance serves for the credentials it issues
               (ADR-34). Root-mounted for the same reason the documents above are: a
               verifier holding one of those credentials has the URL the credential
               names and nothing else, so reaching the list cannot depend on knowing
               this instance's API prefix. A prefix rather than an exact path because
               the list id is part of it. */}}
          {{- /* The public C2PA manifest store (ADR-4, DCS-OR-C2PA-008): the
               "public sibling of did.json". Root-mounted like the status list
               and for the same reason: an external verifier resolving a
               contract's provenance has the manifest URL and nothing else. */}}
          - path: /c2pa/
            pathType: Prefix
            backend:
              service:
                name: {{ include "digital-contracting-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port | int }}
          - path: /status-list/
            pathType: Prefix
            backend:
              service:
                name: {{ include "digital-contracting-service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port | int }}
          {{- /* Hydra public OAuth2/OIDC routes — keeps Hydra off the edge; browser traffic
               proxied through this ingress. selfIssuerURL must match the ingress host. */}}
          {{- if and $.Values.hydra.enabled $.Values.hydra.route.paths }}
          {{- range $.Values.hydra.route.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-hydra
                port:
                  number: {{ $.Values.hydra.service.publicPort | int }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}