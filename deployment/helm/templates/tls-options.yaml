{{- if include "digital-contracting-service.tlsOptionEnforced" . }}
{{/*
DCS-IR-CI-01 / DCS-NFR-SEC-01: every connection to a DCS interface uses TLS
1.3; SSL 3.0, TLS 1.0 and TLS 1.1 are excluded.

A minimum version can be enforced only where TLS terminates. In the stacks
that bring Traefik from this chart, that is here; when the platform ingress
terminates TLS instead (values.prod.yml leaves ingress.className empty and uses
the cluster default), the setting belongs there: deployment guide, section
"TLS".

Without this resource the controller default decides which protocol versions
are negotiated. Traefik without a TLSOption also accepts TLS 1.2, which does
not meet the requirement.
*/}}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-tls13
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
spec:
  minVersion: {{ .Values.ingress.tlsOptions.minVersion | quote }}
  {{- with .Values.ingress.tlsOptions.maxVersion }}
  maxVersion: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tlsOptions.cipherSuites }}
  # Applies to TLS 1.2 only. Under TLS 1.3 the standard sets the suites and Go
  # ignores the list; it is here for an environment that must lower
  # minVersion for a time.
  cipherSuites:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ingress.tlsOptions.sniStrict }}
  sniStrict: {{ . }}
  {{- end }}
{{- end }}
