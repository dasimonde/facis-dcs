{{- if .Values.pdfCore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-pdf-core
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdf-core
spec:
  replicas: {{ .Values.pdfCore.replicaCount }}
  selector:
    matchLabels:
      {{- include "digital-contracting-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pdf-core
  template:
    metadata:
      labels:
        {{- include "digital-contracting-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: pdf-core
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pdf-core
          image: "{{ .Values.pdfCore.image.repository }}:{{ .Values.pdfCore.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.pdfCore.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.pdfCore.service.port }}
              protocol: TCP
          env:
            - name: DCS_PDF_CORE_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.pdfCore.service.port | quote }}
            - name: DCS_PDF_CORE_ONTOLOGY_BASE_URL
              value: {{ .Values.pdfCore.ontologyBaseURL | default (include "digital-contracting-service.pdfCoreURL" .) | quote }}
            # pdf-core holds no key material and no certificate: it prepares the
            # COSE Sig_structures, the DCS backend signs them with the PKCS#11
            # dcs-c2pa key (DCS-IR-HI-01) and sends the matching certificate
            # chain on every request in the X-DCS-C2PA-X5Chain header, and
            # pdf-core embeds the returned signatures and that chain.
          {{- with .Values.pdfCore.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /swagger.json
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /swagger.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
{{- end }}
