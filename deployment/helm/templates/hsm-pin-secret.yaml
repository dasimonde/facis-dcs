{{- if not .Values.pkcs11.pinSecretRef.name }}
{{- $name := include "digital-contracting-service.hsmPinSecretName" . }}
{{- $key := .Values.pkcs11.pinSecretRef.key }}
{{- $pin := .Values.pkcs11.pin }}
{{- if not $pin }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pin = (get ($existing.data | default dict) $key) | b64dec | default (randAlphaNum 32) }}
{{- end }}
# PKCS#11 token PIN (PKCS11_PIN). Auto-created from pkcs11.pin unless an
# existing Secret is supplied via pkcs11.pinSecretRef.name. With pkcs11.pin
# empty, the PIN is random on install and kept from this Secret on upgrade
# (DCS-NFR-SEC-12).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $pin | quote }}
{{- end }}
