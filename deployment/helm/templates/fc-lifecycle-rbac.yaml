{{- if and .Values.fcservice.enabled .Values.fcservice.realmProvision.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-fc-lifecycle
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-fc-lifecycle
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "digital-contracting-service.fullname" . }}-fc-lifecycle
  labels:
    {{- include "digital-contracting-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "digital-contracting-service.fullname" . }}-fc-lifecycle
subjects:
  - kind: ServiceAccount
    name: {{ include "digital-contracting-service.fullname" . }}-fc-lifecycle
    namespace: {{ .Release.Namespace }}
{{- end }}
