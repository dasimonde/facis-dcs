version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # gosec (DCS-NFR-SEC-15) checks the shipped code. Tests use fixture
      # credentials, testdata paths and unbounded httptest handlers on purpose.
      - path: _test\.go
        linters:
          - gosec
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1001"
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - digital-contracting-service